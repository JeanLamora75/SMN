name: SMN 472-476 Prompt Refactor
on:
  push:
    branches: [main]
    paths:
      - 'src/lib/ai-brief-*.ts'
      - 'src/server/ai-briefs/templates.ts'
      - 'src/app/app/admin/ai-briefs/**'
      - 'src/app/app/reports/office-tag-configurator.tsx'
      - 'tests/smn-47*-*.test.ts'
      - 'scripts/apply-smn-472-prompt-text.ts'
      - 'prisma/migrations/20261116_smn472_prompt_text/**'
      - '.github/workflows/smn-472-476.yml'
  workflow_dispatch:
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tests du parcours IA
        run: pnpm test:smn-472-476
      - name: Types TypeScript
        run: pnpm typecheck
      - name: Lint des fichiers modifiés
        run: pnpm exec eslint src/lib/ai-brief-prompt.ts src/lib/ai-brief-tag-resolver.ts src/lib/ai-brief-tag-insertion.ts src/lib/ai-brief-review.ts src/server/ai-briefs/templates.ts src/app/app/admin/ai-briefs/templates/template-editor.tsx src/app/app/admin/ai-briefs/prepare/brief-overrides.tsx src/app/app/admin/ai-briefs/prepare/page.tsx src/app/app/reports/office-tag-configurator.tsx
