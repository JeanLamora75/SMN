name: SMN-403 — Sauvegarde Office
on:
  push:
    branches: ["main"]
    paths:
      - "src/server/reports/office-storage.ts"
      - "src/app/api/admin/reports/office-templates/generate/route.ts"
      - "src/app/app/reports/office-template-catalog.tsx"
      - "tests/smn-403-office-storage.test.ts"
      - ".github/workflows/smn-403-office-storage.yml"
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  office-storage:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.10.0"
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Contrats sauvegarde Office
        run: pnpm exec tsx --test tests/smn-403-office-storage.test.ts
      - name: TypeScript
        run: pnpm typecheck
      - name: ESLint ciblé
        run: pnpm exec eslint src/server/reports/office-storage.ts src/app/api/admin/reports/office-templates/generate/route.ts src/app/app/reports/office-template-catalog.tsx tests/smn-403-office-storage.test.ts
