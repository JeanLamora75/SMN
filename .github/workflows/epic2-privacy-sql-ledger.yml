name: Epic 2 - Privacy SQL guards and external ledger
on:
  push:
    branches: [main]
    paths:
      - "scripts/smn-40-maintenance.ts"
      - "scripts/smn-40-privacy-install-preflight.ts"
      - "scripts/smn-40-ledger-enrollment.ts"
      - "scripts/windows/privacy-ledger-env.mjs"
      - "src/server/backup/erasure-ledger.ts"
      - "src/server/backup/restore-audit-preview.ts"
      - "tests/smn-40-privacy-install-and-ledger.test.ts"
      - "tests/smn-40-privacy-migration-pg.test.ts"
      - "docs/SMN-40-MIGRATION-SQL-REGISTRE-WINDOWS.md"
      - ".github/workflows/epic2-privacy-sql-ledger.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  privacy-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.10.0"
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Check privacy maintenance contracts
        run: pnpm exec tsx --test tests/smn-40-privacy-install-and-ledger.test.ts tests/smn-40-maintenance.test.ts tests/epic2-lot4-erasure-ledger.test.ts
      - name: Typecheck
        run: pnpm typecheck
  pg18-isolated:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: smn_ci
          POSTGRES_PASSWORD: smn_ci_ephemeral_test
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smn_ci -d postgres"
          --health-interval 10s --health-timeout 5s --health-retries 8
    env:
      SMN_TEST_DATABASE_URL: postgresql://smn_ci:smn_ci_ephemeral_test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.10.0"
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Additive migration with real PostgreSQL 18 disposable database
        run: pnpm exec tsx --test tests/smn-40-privacy-migration-pg.test.ts
