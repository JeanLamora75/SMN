name: Office — Tags de contexte sprint et produit
on:
  push:
    branches: ["main"]
    paths:
      - "src/server/reports/office-context-scalars.ts"
      - "src/server/reports/team-context-read.ts"
      - "src/server/sprints/goals-detail-read.ts"
      - "src/app/api/admin/reports/office-templates/generate/route.ts"
      - "src/app/app/reports/office-tags.tsx"
      - "scripts/smn-399-office-scalars.mjs"
      - "tests/smn-office-context-scalars.test.ts"
      - ".github/workflows/office-context-scalars.yml"
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  context-scalars:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.10.0"
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Tester les tags Office contextuels
        run: pnpm exec tsx --test tests/smn-office-context-scalars.test.ts
      - name: Non-régression des tags et des contextes
        run: pnpm exec tsx --test tests/smn-399-office-scalars.test.mjs tests/smn-405-office-acceptance.test.ts
      - name: TypeScript
        run: pnpm typecheck
      - name: ESLint ciblé
        run: pnpm exec eslint src/server/reports/office-context-scalars.ts src/app/app/reports/office-tags.tsx tests/smn-office-context-scalars.test.ts
