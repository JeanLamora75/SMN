name: SMN-413 — Synchroniser dépendance de rendu
on:
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.10.0"
          run_install: false
      - name: Mettre le lockfile en cohérence avec package.json
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Publier la résolution exacte pour la reproductibilité
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile déjà cohérent"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(reports): lock resvg production dependencies"
          git push origin HEAD:main
