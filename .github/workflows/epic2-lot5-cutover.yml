name: Epic 2 Lot 5 — Offline Restore Cutover Qualification
on:
  push:
    branches: [main]
    paths:
      - "src/server/backup/restore-cutover-drill.ts"
      - "src/server/backup/restore-file-cutover-drill.ts"
      - "src/server/backup/restore-coordinated-drill.ts"
      - "tests/epic2-lot5-coordinated-pg.test.ts"
      - "src/server/auth/session-store.ts"
      - "src/server/backup/restore-maintenance.ts"
      - "src/server/backup/recovery-drill-measurement.ts"
      - "tests/epic2-lot9-*.test.ts"
      - "tests/epic2-lot5-maintenance.test.ts"
      - "src/server/auth/session.ts"
      - "tests/epic2-lot5-file-cutover.test.ts"
      - "tests/epic2-lot5-session-reset.test.ts"
      - "src/server/backup/restore-readiness.ts"
      - "src/app/api/admin/sprints/[sprintId]/ceremonies-bulk/route.ts"
      - "src/app/app/admin/registries/registry-list.tsx"
      - "tests/epic2-lot5-cutover-pg.test.ts"
      - "tests/epic2-lot5-cutover-policy.test.ts"
      - "tests/backup-restore-readiness.test.ts"
      - "tests/smn-34-restore-qualification.test.ts"
      - "tests/smn-34-live-restore-safety.test.ts"
      - "tests/smn-34-audit-readonly.test.ts"
      - "tests/smn-34-recette-checklist.test.ts"
      - "scripts/windows/smn-34-recette-contract.mjs"
      - "scripts/windows/smn-34-recette-check.mjs"
      - "src/server/backup/restore-offline-operator-preflight.ts"
      - "scripts/smn-34-offline-preflight.ts"
      - "tests/smn-34-offline-operator-preflight.test.ts"
      - "tests/smn-34-offline-operator-preflight-pg.test.ts"
      - "scripts/smn-34-offline-cutover-sandbox.ts"
      - "tests/smn-34-offline-cutover-sandbox.test.ts"
      - "tests/smn-34-offline-cutover-cli-pg.test.ts"
      - "scripts/smn-34-sandbox-maintenance.ts"
      - "tests/smn-34-sandbox-maintenance-process.test.ts"
      - "src/server/backup/restore-audit.ts"
      - "src/server/backup/restore-audit-preview.ts"
      - "scripts/smn-34-audit-readonly.ts"
      - "package.json"
      - "src/app/app/admin/backups/backups-admin.tsx"
      - "src/i18n/fr.json"
      - "src/i18n/en.json"
      - "src/server/backup/restore-activation-policy.ts"
      - ".github/workflows/epic2-lot5-cutover.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.10.0"
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Restore readiness and cutover controls
        run: pnpm exec tsx --test tests/backup-restore-readiness.test.ts tests/smn-34-restore-qualification.test.ts tests/smn-34-live-restore-safety.test.ts tests/smn-34-audit-readonly.test.ts tests/smn-34-recette-checklist.test.ts tests/smn-34-offline-operator-preflight.test.ts tests/smn-34-offline-cutover-sandbox.test.ts tests/smn-34-sandbox-maintenance-process.test.ts tests/epic2-lot5-cutover-policy.test.ts tests/epic2-lot5-file-cutover.test.ts tests/epic2-lot5-session-reset.test.ts tests/epic2-lot5-maintenance.test.ts tests/epic2-lot9-maintenance-reset.test.ts tests/epic2-lot9-recovery-measurement.test.ts
      - name: TypeScript
        run: pnpm typecheck
      - name: Translations
        run: pnpm i18n:check
  postgres-18-cutover:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: smn_ci
          POSTGRES_PASSWORD: smn_ci_ephemeral_test
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smn_ci -d postgres"
          --health-interval 10s --health-timeout 5s --health-retries 8
    env:
      SMN_TEST_DATABASE_URL: postgresql://smn_ci:smn_ci_ephemeral_test@127.0.0.1:5432/postgres
      SMN_CUTOVER_TEST_DIAGNOSTIC: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.10.0"
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: PostgreSQL 18 actual offline cutover, rollback and fault injection
        run: |
          pnpm exec tsx --test tests/epic2-lot5-cutover-pg.test.ts
          pnpm exec tsx --test tests/epic2-lot5-coordinated-pg.test.ts
          pnpm exec tsx --test tests/smn-34-offline-operator-preflight-pg.test.ts
          pnpm exec tsx --test tests/smn-34-offline-cutover-cli-pg.test.ts
