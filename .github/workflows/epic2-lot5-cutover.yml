name: Epic 2 Lot 5 — Offline Restore Cutover Qualification
on:
  push:
    branches: [main]
    paths:
      - "src/server/backup/restore-cutover-drill.ts"
      - "src/server/backup/restore-file-cutover-drill.ts"
      - "src/server/backup/restore-coordinated-drill.ts"
      - "tests/epic2-lot5-coordinated-pg.test.ts"
      - "src/server/auth/session-store.ts"
      - "src/server/auth/session.ts"
      - "tests/epic2-lot5-file-cutover.test.ts"
      - "tests/epic2-lot5-session-reset.test.ts"
      - "src/server/backup/restore-readiness.ts"
      - "tests/epic2-lot5-cutover-pg.test.ts"
      - "tests/epic2-lot5-cutover-policy.test.ts"
      - "src/server/backup/restore-activation-policy.ts"
      - ".github/workflows/epic2-lot5-cutover.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.10.0"
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Restore readiness and cutover controls
        run: pnpm exec tsx --test tests/backup-restore-readiness.test.ts tests/epic2-lot5-cutover-policy.test.ts tests/epic2-lot5-file-cutover.test.ts tests/epic2-lot5-session-reset.test.ts
      - name: TypeScript
        run: pnpm typecheck
      - name: Translations
        run: pnpm i18n:check
  postgres-18-cutover:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: smn_ci
          POSTGRES_PASSWORD: smn_ci_ephemeral_test
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smn_ci -d postgres"
          --health-interval 10s --health-timeout 5s --health-retries 8
    env:
      SMN_TEST_DATABASE_URL: postgresql://smn_ci:smn_ci_ephemeral_test@127.0.0.1:5432/postgres
      SMN_CUTOVER_TEST_DIAGNOSTIC: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.10.0"
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: PostgreSQL 18 actual offline cutover, rollback and fault injection
        run: pnpm exec tsx --test tests/epic2-lot5-cutover-pg.test.ts tests/epic2-lot5-coordinated-pg.test.ts
