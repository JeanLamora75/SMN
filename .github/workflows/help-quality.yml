name: SMN-469 — Recette Aide FR-EN et hors ligne
on:
  push:
    branches: [main]
    paths:
      - "content/help/**"
      - ".agents/skills/bmad-agent-camille/**"
      - "_bmad/custom/bmad-agent-camille.toml"
      - "_bmad/custom/config.toml"
      - "scripts/camille-*.mjs"
      - "tests/smn-470-camille-skill.test.mjs"
      - "src/app/app/help/**"
      - "src/server/help-*.ts"
      - "src/lib/help-*.ts"
      - "src/lib/private-navigation.ts"
      - "src/i18n/*.json"
      - "src/app/app/bootstrap-icon.tsx"
      - "scripts/report-chrome.mjs"
      - "src/app/api/help/**"
      - "scripts/build-help-index.mjs"
      - "scripts/windows/verify-offline-help.mjs"
      - "scripts/windows/package-portable.mjs"
      - "tests/help-au01-kanban-access.test.ts"
      - "tests/help-au02-context-entry.test.ts"
      - "tests/help-au03-role-safe-links.test.ts"
      - "src/app/app/admin/members/team-overview.tsx"
      - "src/app/app/team-calendar/team-calendar-view.tsx"
      - "src/app/app/admin/kanban-periods/period-form.tsx"
      - "tests/smn-45*-help-*.ts"
      - "tests/smn-46*-help-*.ts"
      - "tests/smn-468-offline-help.test.mjs"
      - "tests/smn-469-help-*.ts"
      - "_bmad-output/planning-artifacts/ux-designs/ux-aide-smn-2026-11-14/**"
      - ".github/workflows/help-quality.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smn-help-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  help-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.10.0"
          run_install: false
      - name: Dépendances verrouillées
        run: pnpm install --frozen-lockfile
      - name: Vérifier la fraîcheur des index d'aide
        run: node scripts/build-help-index.mjs --check
      - name: HELP offline 1 — couverture source
        run: node --test --test-reporter=spec --test-name-pattern="source documentary" tests/smn-468-offline-help.test.mjs
      - name: HELP offline 2 — copie de distribution
        run: node --test --test-reporter=spec --test-name-pattern="Windows-like" tests/smn-468-offline-help.test.mjs
      - name: HELP offline 3 — rejet ressources manquantes
        run: node --test --test-reporter=spec --test-name-pattern="missing articles" tests/smn-468-offline-help.test.mjs
      - name: HELP offline 4 — contrat packaging
        run: node --test --test-reporter=spec --test-name-pattern="application packaging" tests/smn-468-offline-help.test.mjs
      - name: Contrats HELP-01 à HELP-30 — sécurité, langues, droits, contenu et localStorage
        run: |
          pnpm exec tsx --test \
            tests/help-au01-kanban-access.test.ts \
            tests/help-au02-context-entry.test.ts \
            tests/help-au03-role-safe-links.test.ts \
            tests/smn-459-help-catalog.test.ts \
            tests/smn-460-help-content.test.ts \
            tests/smn-461-help-center.test.ts \
            tests/smn-462-help-search.test.ts \
            tests/smn-463-help-context-dialog.test.ts \
            tests/smn-464-help-header.test.ts \
            tests/smn-465-help-checklist.test.ts \
            tests/smn-466-help-first-setup.test.ts \
            tests/smn-467-help-guides.test.ts \
            tests/smn-469-help-contract.test.ts
      - name: Chromium réel — 3 passages indépendants contre les instabilités
        run: |
          for iteration in 1 2 3; do
            echo "::group::Aide Chromium — répétition $iteration/3"
            pnpm exec tsx --test \
              tests/smn-464-help-browser.test.ts \
              tests/smn-465-help-checklist-browser.test.ts \
              tests/smn-469-help-browser.test.ts
            echo "::endgroup::"
          done
      - name: Archiver les captures de la modale en Chromium (fixture)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: smn-469-help-browser-fixture
          path: audit-output/help-qa/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: SMN-470 — valider le skill Camille et ses cinq critères Jira
        run: node --test --test-reporter=spec tests/smn-470-camille-skill.test.mjs
      - name: SMN-470 — exécuter le pilote documentaire FR/EN isolé
        run: node scripts/camille-pilot.mjs --evidence _bmad-output/test-artifacts/camille/pilot-smn-470.md
      - name: Archiver les preuves du pilote Camille
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smn-470-camille-pilot
          path: _bmad-output/test-artifacts/camille/pilot-smn-470.md
          if-no-files-found: warn
          retention-days: 30
      - name: TypeScript et i18n
        run: |
          pnpm typecheck
          pnpm i18n:check
      - name: Build SMN avec les ressources documentaires
        run: pnpm build
