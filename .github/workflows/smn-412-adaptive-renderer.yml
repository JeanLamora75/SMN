name: SMN-412 — Rendu graphique adaptatif
on:
  push:
    branches: [main]
    paths:
      - "scripts/smn-412-adaptive-chart.mjs"
      - "tests/smn-412-adaptive-chart.test.mjs"
      - "scripts/poc/smn-412-render-samples.mjs"
      - ".github/workflows/smn-412-adaptive-renderer.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adaptive-renderer:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.10.0"
          run_install: false
      - name: Installer les dépendances verrouillées à la racine
        run: pnpm install --frozen-lockfile
      - name: Tests géométrie et six types de graphiques
        run: node --test tests/smn-411-chart-targets.test.mjs tests/smn-412-adaptive-chart.test.mjs
      - name: Générer les échantillons pour validation visuelle
        run: node scripts/poc/smn-412-render-samples.mjs smn-412-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: smn-412-reference-${{ matrix.os }}
          path: smn-412-evidence/
          if-no-files-found: error
      - name: Typecheck SMN
        run: pnpm typecheck
      - name: ESLint ciblé
        run: pnpm exec eslint scripts/smn-412-adaptive-chart.mjs tests/smn-412-adaptive-chart.test.mjs
