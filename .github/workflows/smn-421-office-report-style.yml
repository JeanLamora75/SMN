name: SMN-421 — Style graphique facultatif à l'export Office
on:
  push:
    branches: [main]
    paths:
      - "src/app/app/reports/office-template-catalog.tsx"
      - "src/app/api/admin/reports/office-templates/generate/route.ts"
      - "src/server/reports/office-chart-style-resolver.ts"
      - "src/i18n/fr.json"
      - "src/i18n/en.json"
      - "tests/smn-421-office-report-style.test.ts"
      - "package.json"
      - ".github/workflows/smn-421-office-report-style.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report-style:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.10.0"
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Vérifier la priorité des styles, les tags et les flux Office
        run: pnpm test:smn-421
      - name: Contrôle TypeScript
        run: pnpm typecheck
      - name: Analyse statique
        run: pnpm exec eslint src/app/app/reports/office-template-catalog.tsx src/app/api/admin/reports/office-templates/generate/route.ts tests/smn-421-office-report-style.test.ts
      - name: Traductions FR/EN
        run: pnpm i18n:check
