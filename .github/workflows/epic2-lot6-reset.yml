name: Epic 2 Lot 6 — Controlled Installation Reset
on:
  push:
    branches: [main]
    paths:
      - "src/server/installation/reset-*"
      - "src/server/backup/restore-file-cutover-drill.ts"
      - "src/server/backup/restore-coordinated-drill.ts"
      - "src/server/backup/restore-maintenance.ts"
      - "src/server/backup/recovery-drill-measurement.ts"
      - "tests/epic2-lot9-*.test.ts"
      - "src/app/api/admin/installation/reset/**"
      - "src/app/app/admin/backups/installation-reset-preview.tsx"
      - "src/i18n/fr.json"
      - "src/i18n/en.json"
      - "tests/epic2-lot6-*.test.ts"
      - "tests/smn-37-installation-reset-policy.test.ts"
      - ".github/workflows/epic2-lot6-reset.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.10.0"
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Reset authorization and policies
        run: pnpm exec tsx --test tests/smn-37-installation-reset-policy.test.ts tests/epic2-lot9-maintenance-reset.test.ts tests/epic2-lot9-recovery-measurement.test.ts
      - name: TypeScript
        run: pnpm typecheck
      - name: Translations
        run: pnpm i18n:check
  postgres18:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: smn_ci
          POSTGRES_PASSWORD: smn_ci_ephemeral_test
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smn_ci -d postgres"
          --health-interval 10s --health-timeout 5s --health-retries 8
    env:
      SMN_TEST_DATABASE_URL: postgresql://smn_ci:smn_ci_ephemeral_test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.10.0"
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: New native v33 isolated install and rollback
        run: pnpm exec tsx --test tests/epic2-lot6-reset-pg.test.ts
      - name: TypeScript
        run: pnpm typecheck
