name: SMN-349 — Dynamic reporting
on:
  push:
    branches: ["feature/smn-349-dynamic-reporting", "main"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  reporting:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: smn_ci
          POSTGRES_PASSWORD: smn_ci_ephemeral_test
          POSTGRES_DB: smn_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smn_ci -d smn_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SMN_TEST_DATABASE_URL: postgresql://smn_ci:smn_ci_ephemeral_test@127.0.0.1:5432/smn_ci
      SMN_DATABASE_URL: postgresql://smn_ci:smn_ci_ephemeral_test@127.0.0.1:5432/smn_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.10.0"
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Contrat orchestrateur
        run: pnpm test:validate-version
      - name: Validation commune v33 — SMN-349
        run: node scripts/validate-version.mjs --profile smn-349 --scope feature
      - name: Archiver le rapport commun
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: version-validation-smn-349
          path: audit-output/version-validation-smn-349.json
          if-no-files-found: warn
