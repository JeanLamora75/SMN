name: Epic 2 Lot 7 - Protection Operation Recovery
on:
  push:
    branches: [main]
    paths:
      - "src/server/backup/operation-artifacts.ts"
      - "src/server/backup/operation-diagnostics.ts"
      - "src/server/backup/protection-diagnostics.ts"
      - "src/server/backup/retention-evidence.ts"
      - "src/server/backup/retention-interruptions.ts"
      - "src/server/backup/retention.ts"
      - "src/server/backup/runner.ts"
      - "src/app/api/admin/backups/operations/route.ts"
      - "src/app/app/admin/backups/protection-operations.tsx"
      - "src/i18n/fr.json"
      - "src/i18n/en.json"
      - "tests/smn-41-operation-diagnostics.test.ts"
      - "tests/epic2-lot7-*.test.ts"
      - ".github/workflows/epic2-lot7-interruptions.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery-contracts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.10.0"
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Interruption and classification contracts
        run: pnpm exec tsx --test tests/smn-41-operation-diagnostics.test.ts tests/epic2-lot7-operation-artifacts.test.ts tests/epic2-lot2-retention-safety.test.ts tests/backup-retention.test.ts tests/manual-backup.test.ts
      - name: TypeScript
        run: pnpm typecheck
      - name: Translations
        run: pnpm i18n:check
  postgres18-retention:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: smn_ci
          POSTGRES_PASSWORD: smn_ci_ephemeral_test
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smn_ci -d postgres"
          --health-interval 10s --health-timeout 5s --health-retries 8
    env:
      SMN_TEST_DATABASE_URL: postgresql://smn_ci:smn_ci_ephemeral_test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.10.0"
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Verify real PG18 retention audit against file evidence
        run: pnpm exec tsx --test tests/epic2-lot7-retention-pg.test.ts
      - name: TypeScript
        run: pnpm typecheck
