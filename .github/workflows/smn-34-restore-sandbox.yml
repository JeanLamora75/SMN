name: SMN-34 — Restauration isolée et gardes
on:
  push:
    branches: [main]
    paths:
      - "src/server/backup/restore-sandbox.ts"
      - "src/server/backup/extra-archives.ts"
      - "src/server/backup/runner.ts"
      - "src/server/backup/verification.ts"
      - "src/server/backup/files.ts"
      - "tests/smn-34-v3-postgres.test.ts"
      - "tests/smn-34-extra-archives.test.ts"
      - "src/server/backup/restore-sandbox-policy.ts"
      - "src/server/backup/restore-readiness.ts"
      - "scripts/smn-34-restore-rehearsal.ts"
      - "tests/smn-34-restore-sandbox.test.ts"
      - ".github/workflows/smn-34-restore-sandbox.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sandbox-policy:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.10.0"
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Contrats de non-écrasement des bases
        run: pnpm exec tsx --test tests/smn-34-restore-sandbox.test.ts tests/smn-34-extra-archives.test.ts tests/backup-restore-readiness.test.ts tests/backup-erasure-protection.test.ts
      - name: TypeScript
        run: pnpm typecheck
      - name: Traductions
        run: pnpm i18n:check

  postgres-18-v3-reconstruction:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: smn_ci
          POSTGRES_PASSWORD: smn_ci_ephemeral_test
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smn_ci -d postgres"
          --health-interval 10s --health-timeout 5s --health-retries 8
    env:
      SMN_TEST_DATABASE_URL: postgresql://smn_ci:smn_ci_ephemeral_test@127.0.0.1:5432/postgres
      SMN_PG_DUMP_PATH: /usr/lib/postgresql/18/bin/pg_dump
      SMN_PG_RESTORE_PATH: /usr/lib/postgresql/18/bin/pg_restore
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.10.0"
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Installer uniquement le client officiel PostgreSQL 18 dans la VM CI
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          /usr/lib/postgresql/18/bin/pg_dump --version
          /usr/lib/postgresql/18/bin/pg_restore --version
      - name: Recette réelle de reconstruction isolée PostgreSQL 18
        run: pnpm exec tsx --test tests/smn-34-v3-postgres.test.ts
      - name: Vérifier le typage et les contrats de sécurité
        run: |
          pnpm typecheck
          pnpm exec tsx --test tests/smn-34-restore-sandbox.test.ts
