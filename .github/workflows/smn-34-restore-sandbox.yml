name: SMN-34 — Restauration isolée et gardes
on:
  push:
    branches: [main]
    paths:
      - "src/server/backup/restore-sandbox.ts"
      - "src/server/backup/restore-sandbox-policy.ts"
      - "src/server/backup/restore-readiness.ts"
      - "scripts/smn-34-restore-rehearsal.ts"
      - "tests/smn-34-restore-sandbox.test.ts"
      - ".github/workflows/smn-34-restore-sandbox.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sandbox-policy:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.10.0"
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Contrats de non-écrasement des bases
        run: pnpm exec tsx --test tests/smn-34-restore-sandbox.test.ts tests/backup-restore-readiness.test.ts tests/backup-erasure-protection.test.ts
      - name: TypeScript
        run: pnpm typecheck
      - name: Traductions
        run: pnpm i18n:check
