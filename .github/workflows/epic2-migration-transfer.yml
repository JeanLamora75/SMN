name: Epic 2 — Migration inter-PC et paquet chiffré

on:
  push:
    branches: [main]
    paths:
      - "src/server/backup/portable-package.ts"
      - "src/server/backup/portable-import.ts"
      - "src/server/backup/migration-source-policy.ts"
      - "src/app/api/admin/backups/migration/**"
      - "scripts/smn-40-portable-import.ts"
      - "scripts/smn-40-migration-destination-check.ts"
      - "scripts/smn-40-current-state-comparison.ts"
      - "src/server/backup/fresh-computer-transfer-policy.ts"
      - "src/server/backup/current-state-transfer-receipt.ts"
      - "scripts/smn-40-newpc-reconstruct.ts"
      - "scripts/windows/smn-40-newpc-one-shot.ps1"
      - "tests/smn-40-portable-*.test.ts"
      - "tests/smn-40-migration-source.test.ts"
      - "tests/smn-40-migration-destination.test.ts"
      - "tests/smn-40-current-state-comparison.test.ts"
      - "tests/smn-40-fresh-computer-transfer-policy.test.ts"
      - "tests/smn-40-current-state-transfer-receipt.test.ts"
      - "tests/smn-40-newpc-reconstruct.test.ts"
      - ".github/workflows/epic2-migration-transfer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encrypted-transfer:
    name: Transfert chiffré (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.10.0"
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Export, import, intégrité et refus de restauration active
        run: pnpm exec tsx --test tests/smn-40-migration-source.test.ts tests/smn-40-migration-destination.test.ts tests/smn-40-current-state-comparison.test.ts tests/smn-40-fresh-computer-transfer-policy.test.ts tests/smn-40-current-state-transfer-receipt.test.ts tests/smn-40-portable-package.test.ts tests/smn-40-portable-import.test.ts tests/smn-40-newpc-reconstruct.test.ts
      - name: Contrat TypeScript
        run: pnpm typecheck
      - name: Traductions
        run: pnpm i18n:check
