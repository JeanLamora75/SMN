name: SMN-440 — Tendances moteur graphique Office partagé
on:
  push:
    branches: [main]
    paths:
      - "src/app/app/admin/indicators/indicator-trends.tsx"
      - "src/app/app/admin/indicators/shared-trend-chart.tsx"
      - "src/app/app/admin/sprints/**/sprint-trends-panel.tsx"
      - "src/app/api/admin/reports/charts/render/route.ts"
      - "src/i18n/fr.json"
      - "src/i18n/en.json"
      - "tests/smn-440-shared-trend-renderer.test.ts"
      - ".github/workflows/smn-440-shared-trends.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared-trends:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.10.0"
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Moteur partagé et non-régression Office
        run: pnpm exec tsx --test tests/smn-440-shared-trend-renderer.test.ts tests/smn-412-adaptive-chart.test.mjs tests/smn-418-unified-office-charts.test.ts
      - name: Parité des langues
        run: pnpm i18n:check
      - name: TypeScript
        run: pnpm typecheck
      - name: ESLint
        run: pnpm exec eslint src/app/app/admin/indicators/shared-trend-chart.tsx src/app/app/admin/indicators/indicator-trends.tsx src/app/app/admin/sprints/[sprintId]/sprint-trends-panel.tsx src/app/api/admin/reports/charts/render/route.ts tests/smn-440-shared-trend-renderer.test.ts
