name: SMN — Mises à jour Windows signées
on:
  push:
    branches: [main]
    paths:
      - "scripts/windows/**"
      - "tests/update-package.test.mjs"
      - "tests/update-import.test.mjs"
      - "tests/distribution-layout.test.mjs"
      - ".github/workflows/update-package.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "full = application complète sans runtimes ; delta = fichiers modifiés"
        type: choice
        required: true
        default: full
        options: [full, delta]
      from_version:
        description: "Version source explicite pour mode full (ex. 33.0.0)"
        type: string
        required: true
        default: "33.0.0"
      base_run_id:
        description: "Identifiant du run de distribution Windows de référence (obligatoire en mode delta)"
        type: string
        required: false
permissions:
  contents: read
  actions: read

jobs:
  update-contract-tests:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Contrat de mise à jour, signatures et scénarios hostiles
        run: node --test tests/distribution-layout.test.mjs tests/update-package.test.mjs tests/update-import.test.mjs

  update-build-smoke:
    if: github.event_name == 'push'
    needs: update-contract-tests
    runs-on: windows-latest
    timeout-minutes: 18
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SMN_PACKAGE_DIR: _package/SMN-Windows
      SMN_UPDATE_SKIP_PG_ARCHIVE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Installer les dépendances Windows
        run: npm install --no-package-lock --no-audit --no-fund --legacy-peer-deps
      - name: Compiler SMN pour le paquet application
        env:
          SMN_BUILD_STANDALONE: "1"
        run: npm run build
      - name: Préparer les fichiers sans PostgreSQL
        run: node scripts/windows/package-portable.mjs
      - name: Prouver la mise à jour différentielle signée sur le build réel
        run: node scripts/windows/smoke-update-build.mjs
      - name: Vérifier le ZIP après compression réelle et mesurer le correctif
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $stage=(Resolve-Path '_package/smoke-stage').Path
          $archive=Join-Path (Resolve-Path '_package').Path 'smoke-update-ci-only.zip'
          [System.IO.Compression.ZipFile]::CreateFromDirectory($stage,$archive,[System.IO.Compression.CompressionLevel]::Optimal,$false)
          $unpacked=Join-Path (Resolve-Path '_package').Path 'smoke-unpacked'
          [System.IO.Compression.ZipFile]::ExtractToDirectory($archive,$unpacked)
          & node scripts/windows/verify-update.mjs --dir $unpacked --trust '_package/smoke-public-test-only.pem'
          if ($LASTEXITCODE -ne 0) { throw 'ZIP différentiel inutilisable après compression' }
          Write-Host "CI-ONLY SIGNED SMALL UPDATE ZIP BYTES: $((Get-Item $archive).Length)"
          & node scripts/windows/verify-zipped-update.mjs --zip $archive --out '_package/smoke-native-small' --trust '_package/smoke-public-test-only.pem'
          if ($LASTEXITCODE -ne 0) { throw 'Archive ZIP native refusée par l’importateur SMN' }
          if ((Get-Item $archive).Length -ge 25MB) { throw 'Petit correctif de démonstration supérieur à 25 Mo' }
          $fullStage = (Resolve-Path '_package/smoke-full-stage').Path
          $fullZip = Join-Path (Resolve-Path '_package').Path 'smoke-full-application-ci-only.zip'
          [System.IO.Compression.ZipFile]::CreateFromDirectory($fullStage,$fullZip,[System.IO.Compression.CompressionLevel]::Optimal,$false)
          $fullExtracted = Join-Path (Resolve-Path '_package').Path 'smoke-full-unpacked'
          [System.IO.Compression.ZipFile]::ExtractToDirectory($fullZip,$fullExtracted)
          & node scripts/windows/verify-update.mjs --dir $fullExtracted --trust '_package/smoke-public-test-only.pem'
          if ($LASTEXITCODE -ne 0) { throw 'ZIP application complète non vérifiable après compression' }
          Write-Host "CI-ONLY SIGNED FULL UPDATE ZIP BYTES: $((Get-Item $fullZip).Length)"
          & node scripts/windows/verify-zipped-update.mjs --zip $fullZip --out '_package/smoke-native-full' --trust '_package/smoke-public-test-only.pem'
          if ($LASTEXITCODE -ne 0) { throw 'Archive complète refusée par l’importateur SMN' }

  build-signed-update:
    if: github.event_name == 'workflow_dispatch'
    needs: update-contract-tests
    runs-on: windows-latest
    timeout-minutes: 28
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SMN_PACKAGE_DIR: _package/SMN-Windows
      SMN_UPDATE_SKIP_PG_ARCHIVE: "1"
      SMN_UPDATE_SIGNING_KEY_PEM_B64: ${{ secrets.SMN_UPDATE_SIGNING_KEY_PEM_B64 }}
      SMN_RELEASE_MODE: ${{ inputs.mode }}
      SMN_RELEASE_FROM_VERSION: ${{ inputs.from_version }}
      SMN_BASE_RUN_ID: ${{ inputs.base_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Vérifier la clé privée de signature configurée
        shell: pwsh
        run: |
          if (-not $env:SMN_UPDATE_SIGNING_KEY_PEM_B64) {
            throw "SMN_UPDATE_SIGNING_KEY_PEM_B64 absent : aucune mise à jour non signée n'est distribuée."
          }
      - name: Télécharger le paquet de base pour la comparaison différentielle
        if: inputs.mode == 'delta'
        uses: actions/download-artifact@v4
        with:
          name: SMN-Distribution-Windows-x64-v33
          run-id: ${{ inputs.base_run_id }}
          github-token: ${{ github.token }}
          path: _base
      - name: Extraire la distribution de base
        if: inputs.mode == 'delta'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SMN_BASE_RUN_ID -notmatch '^[0-9]+$' -or -not (Test-Path '_base/SMN-Setup-Windows-x64-v33.zip')) {
            throw 'Une distribution SMN de base compatible est obligatoire pour un delta.'
          }
          Expand-Archive -LiteralPath '_base/SMN-Setup-Windows-x64-v33.zip' -DestinationPath '_base/extracted'
          if (-not (Test-Path '_base/extracted/SMN-Windows/distribution-version.json')) {
            throw "La distribution de base doit disposer d'un marqueur de version."
          }
      - name: Installer les dépendances Windows
        run: npm install --no-package-lock --no-audit --no-fund --legacy-peer-deps
      - name: Construire l'application autonome
        env:
          SMN_BUILD_STANDALONE: "1"
        run: npm run build
      - name: Préparer le contenu applicatif sans PostgreSQL
        run: node scripts/windows/package-portable.mjs
      - name: Construire et signer le manifeste et les fichiers de mise à jour
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SMN_RELEASE_MODE -notin @('full','delta')) { throw 'Mode de mise à jour invalide' }
          if ($env:SMN_RELEASE_MODE -eq 'full' -and $env:SMN_RELEASE_FROM_VERSION -notmatch '^33\.[0-9]+\.[0-9]+$') {
            throw 'Version de départ invalide'
          }
          $argsList = @('--target','_package/SMN-Windows','--out','_package/update-stage',
            '--mode',$env:SMN_RELEASE_MODE)
          if ($env:SMN_RELEASE_MODE -eq 'delta') {
            $base = '_base/extracted/SMN-Windows'
            $originalKey = Get-Content -Raw "$base/runtime/trust/update-signing-public.pem"
            $targetKey = Get-Content -Raw '_package/SMN-Windows/runtime/trust/update-signing-public.pem'
            if ($originalKey -ne $targetKey) { throw 'La clé de confiance du paquet de base ne correspond pas à la signature actuelle.' }
            $argsList += @('--base',$base)
          } else {
            $argsList += @('--from',$env:SMN_RELEASE_FROM_VERSION)
          }
          & node scripts/windows/build-update.mjs @argsList
          if ($LASTEXITCODE -ne 0) { throw 'Échec de génération de mise à jour' }
      - name: Vérifier les fichiers et la signature avec la clé publique indépendante
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $verifyArgs = @('--dir','_package/update-stage',
            '--trust','_package/SMN-Windows/runtime/trust/update-signing-public.pem')
          if ($env:SMN_RELEASE_MODE -eq 'delta') {
            $verifyArgs += @('--base','_base/extracted/SMN-Windows')
          }
          & node scripts/windows/verify-update.mjs @verifyArgs
          if ($LASTEXITCODE -ne 0) { throw 'Mise à jour non vérifiable : distribution refusée' }
      - name: Compresser, vérifier à nouveau et mesurer le ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $stage = (Resolve-Path '_package/update-stage').Path
          $target = Join-Path (Resolve-Path '_package').Path ("SMN-Update-" + (Get-Content '_package/SMN-Windows/distribution-version.json' | ConvertFrom-Json).version + ".zip")
          [System.IO.Compression.ZipFile]::CreateFromDirectory($stage,$target,[System.IO.Compression.CompressionLevel]::Optimal,$false)
          $roundtrip = Join-Path (Resolve-Path '_package').Path 'update-roundtrip'
          [System.IO.Compression.ZipFile]::ExtractToDirectory($target,$roundtrip)
          & node scripts/windows/verify-update.mjs --dir $roundtrip --trust '_package/SMN-Windows/runtime/trust/update-signing-public.pem'
          if ($LASTEXITCODE -ne 0) { throw 'ZIP corrompu ou incomplet après compression' }
          $hash = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $target)" | Set-Content -Encoding ascii ($target + '.sha256')
          $size = (Get-Item $target).Length
          Write-Host "SMN UPDATE ZIP bytes: $size"
          Write-Host "SMN UPDATE ZIP SHA256: $hash"
          if ($size -gt 25MB) { Write-Warning "Objectif de 25 Mo dépassé : livraison maintenue et taille documentée." }
      - uses: actions/upload-artifact@v4
        with:
          name: SMN-Update-Windows-signed
          path: |
            _package/SMN-Update-*.zip
            _package/SMN-Update-*.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
