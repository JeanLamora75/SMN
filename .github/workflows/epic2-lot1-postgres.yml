name: Epic 2 Lot 1 — migrations et audit PostgreSQL 18
on:
  push:
    branches: [main]
    paths:
      - "src/server/members/removal-audit.ts"
      - "src/server/backup/erasure-private-documents.ts"
      - "src/server/backup/archive-immutability.ts"
      - "src/server/audit/journal.ts"
      - "scripts/smn-35-archive-guards.ts"
      - "scripts/smn-36-removal-audit.ts"
      - "tests/epic2-lot1-*.test.ts"
      - ".github/workflows/epic2-lot1-postgres.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.10.0"
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Unit tests — audit, guards and rollbacks
        run: pnpm exec tsx --test tests/epic2-lot1-audit-coverage.test.ts tests/audit-journal.test.ts tests/smn-35-atomicity-immutability.test.ts tests/smn-36-lifecycle-safety.test.ts
      - run: pnpm typecheck
      - run: pnpm i18n:check

  isolated-postgresql-18:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: smn_ci
          POSTGRES_PASSWORD: test_only_epic2
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smn_ci -d postgres"
          --health-interval 10s --health-timeout 5s --health-retries 8
    env:
      SMN_TEST_DATABASE_URL: postgresql://smn_ci:test_only_epic2@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.10.0"
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Real PostgreSQL 18 — immutable archives and audit
        run: pnpm exec tsx --test tests/epic2-lot1-postgres.test.ts
