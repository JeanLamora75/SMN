name: SMN — Paquet Windows pilote
on:
  push:
    branches: ["main"]
    paths:
      - "next.config.ts"
      - "src/**"
      - "scripts/windows/**"
      - ".github/workflows/portable-package.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-windows:
    runs-on: windows-latest
    timeout-minutes: 22
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SMN_FULL_INSTALL_TEST: "true"
      SMN_RECOVERY_TEST: "true"
      SMN_PACKAGE_DIR: "_package/SMN-Windows"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Installer les dépendances Windows en dossiers physiques
        # Le build pilote autonome nécessite des fichiers copiables, pas les
        # jonctions Windows générées par le linker pnpm du poste de CI.
        run: npm install --no-package-lock --no-audit --no-fund --legacy-peer-deps
      - name: Compiler SMN
        run: npm run build
      - name: Construire le paquet Node et PostgreSQL Windows vérifiés
        run: node scripts/windows/package-portable.mjs
      - name: Contrôler le lancement autonome du paquet
        run: node scripts/windows/verify-package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: SMN-Pilote-Windows-x64
          path: "_package/SMN-Windows"
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
