name: SMN — Paquet Windows pilote
on:
  push:
    branches: ["main"]
    paths:
      - "next.config.ts"
      - "proxy.ts"
      - "src/**"
      - "scripts/**"
      - "tests/epic2-lot5-session-reset.test.ts"
      - "tests/epic2-lot5-maintenance.test.ts"
      - "tests/epic2-lot9-maintenance-reset.test.ts"
      - "tests/smn-34-windows-launch-maintenance.test.ts"
      - "tests/smn-40-fresh-destination-readiness.test.ts"
      - "tests/smn-40-fresh-install-cutover.test.ts"
      - "tests/smn-40-fresh-cutover-journal.test.ts"
      - "tests/smn-442-local-backup-root.test.ts"
      - "tests/smn-441-portable-zip.test.ts"
      - "tests/smn-442-migration-ui-contract.test.ts"
      - "tests/smn-442-gui-offline-restoration.test.ts"
      - "tests/smn-442-gui-crash-recovery.test.ts"
      - "tests/settings-ux-harmonization.test.ts"
      - "tests/settings-collection-filter.test.ts"
      - "tests/settings-cockpit-ux.test.ts"
      - "tests/smn-224-settings-portal.test.ts"
      - "tests/smn-227-settings-navigation.test.ts"
      - "tests/smn-229-settings-relocation.test.ts"
      - "prisma/baseline/**"
      - "prisma/migrations/20261101_smn_dashboard_slots_additive/**"
      - "_bmad-output/planning-artifacts/SMN-338-DDL-ADDITIF-DRAFT.sql"
      - ".github/workflows/portable-package.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "next.config.ts"
      - "proxy.ts"
      - "src/**"
      - "scripts/**"
      - "tests/settings-cockpit-ux.test.ts"
      - "tests/smn-224-settings-portal.test.ts"
      - "tests/smn-227-settings-navigation.test.ts"
      - "tests/smn-229-settings-relocation.test.ts"
      - "prisma/baseline/**"
      - "prisma/migrations/20261101_smn_dashboard_slots_additive/**"
      - "_bmad-output/planning-artifacts/SMN-338-DDL-ADDITIF-DRAFT.sql"
      - ".github/workflows/portable-package.yml"
  workflow_dispatch:
# New pushes supersede obsolete packaging attempts on the same branch.
concurrency:
  group: smn-portable-package-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  portable-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SMN_FULL_INSTALL_TEST: "true"
      SMN_RECOVERY_TEST: "true"
      SMN_PORT_FALLBACK_TEST: "true"
      SMN_PACKAGE_DIR: "_package/SMN-Windows"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verrouiller le commit source et nettoyer les livrables préexistants
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Commit du checkout différent du commit de livraison' }
          foreach ($p in @('.next', '_package', 'out', 'dist')) {
            if (Test-Path $p) { Remove-Item -LiteralPath $p -Recurse -Force }
          }
          if (Test-Path '_package/SMN-Windows') { throw 'Ancien paquet réutilisé : interdit' }
          Write-Host "Source neuve : $env:GITHUB_SHA"
      - name: Installer les dépendances Windows en dossiers physiques
        # Le build pilote autonome nécessite des fichiers copiables, pas les
        # jonctions Windows générées par le linker pnpm du poste de CI.
        run: npm install --no-package-lock --no-audit --no-fund --legacy-peer-deps
      - name: Contrat de protection des répertoires persistants et racine minimale
        run: node --test tests/distribution-layout.test.mjs tests/distribution-package-policy.test.mjs
      - name: Non-régression migration inter-PC et retour arrière
        run: npx tsx --test tests/smn-40-fresh-destination-readiness.test.ts tests/smn-40-fresh-install-cutover.test.ts tests/smn-40-fresh-cutover-journal.test.ts tests/epic2-lot5-session-reset.test.ts tests/epic2-lot5-maintenance.test.ts tests/epic2-lot9-maintenance-reset.test.ts tests/smn-34-windows-launch-maintenance.test.ts
      - name: Import-export ZIP — format sûr et interface sans ligne de commande
        run: npx tsx --test tests/smn-441-portable-zip.test.ts tests/smn-442-migration-ui-contract.test.ts tests/smn-442-gui-offline-restoration.test.ts tests/smn-442-gui-crash-recovery.test.ts tests/smn-442-local-backup-root.test.ts
      - name: Contrat Paramètres V2 — UX validée et corrections récentes
        run: npx tsx --test tests/settings-cockpit-ux.test.ts tests/settings-ux-harmonization.test.ts tests/settings-collection-filter.test.ts tests/smn-224-settings-portal.test.ts tests/smn-227-settings-navigation.test.ts tests/smn-229-settings-relocation.test.ts
      - name: Contrats installation PostgreSQL hors ligne
        run: node --test tests/postgres-offline-install.test.mjs
      - name: Preuve de transport Windows sans dépendances
        run: node --test tests/update-delivery.test.mjs
      - name: Parité des catalogues FR/EN
        run: npm run i18n:check
      - name: Compiler SMN
        # Le packaging reste autonome ; seul le build local Windows évite
        # les symlinks refusés par les politiques de poste d'entreprise.
        env:
          SMN_BUILD_STANDALONE: "1"
        run: npm run build
      - name: Construire le paquet Node et PostgreSQL Windows vérifiés
        env:
          SMN_UPDATE_SIGNING_KEY_PEM_B64: ${{ secrets.SMN_UPDATE_SIGNING_KEY_PEM_B64 }}
        run: node scripts/windows/package-portable.mjs
      - name: Attester que le ZIP contient le code du dernier commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = Get-Content '_package/SMN-Windows/app/distribution-version.json' -Raw | ConvertFrom-Json
          if ($version.sourceCommit -ne $env:GITHUB_SHA) { throw 'Distribution construite depuis un ancien commit' }
          $current = (git rev-parse HEAD).Trim()
          if ($current -ne $env:GITHUB_SHA) { throw 'Checkout modifié pendant le build' }
      - name: Contrôler le lancement autonome du paquet
        run: node scripts/windows/verify-package.mjs
      - name: Analyser les fichiers distribués avec Microsoft Defender
        shell: pwsh
        run: ./scripts/windows/scan-distribution.ps1 -Stage directory -Target '_package/SMN-Windows'
      - name: Construire le ZIP transmissible et vérifier son empreinte
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = '_package/SMN-Windows'
          $destination = "_package/SMN-Setup-Windows-x64-v33-$env:GITHUB_RUN_ID.zip"
          if (Test-Path "$source/data/postgres") { throw 'Cluster PostgreSQL de test présent dans la distribution' }
          Compress-Archive -Path $source -DestinationPath $destination -CompressionLevel Optimal -Force
          if (-not (Test-Path $destination)) { throw 'Archive de distribution absente' }
          & node scripts/windows/create-delivery-evidence.mjs $destination windows-x64-initial
          if ($LASTEXITCODE -ne 0) { throw 'Bilan de livraison invalide' }
          & node scripts/windows/verify-delivery.mjs $destination ($destination + '.evidence.json') ($destination + '.sha256')
          if ($LASTEXITCODE -ne 0) { throw 'Contrôle intégrité du ZIP final invalide' }
      - name: Analyser le ZIP final avec Microsoft Defender
        shell: pwsh
        run: ./scripts/windows/scan-distribution.ps1 -Stage zip -Target "_package/SMN-Setup-Windows-x64-v33-$env:GITHUB_RUN_ID.zip"
      # GitHub's artifact service can intermittently return HTML instead of
      # its JSON API response. Retry once as a separate artifact. Do NOT mask
      # an unavailable download: if neither upload succeeds the job fails.
      - name: Publier la distribution Windows vérifiée
        id: artifact_primary
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SMN-Distribution-Windows-x64-v33-${{ github.run_id }}
          path: |
            _package/SMN-Setup-Windows-x64-v33-*.zip
            _package/SMN-Setup-Windows-x64-v33-*.zip.sha256
            _package/SMN-Setup-Windows-x64-v33-*.zip.evidence.json
            _package/smn-distribution-inventory.json
            _package/smn-antivirus-report.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Retenter la publication en cas d'erreur du service d'artefacts
        id: artifact_retry
        if: steps.artifact_primary.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SMN-Distribution-Windows-x64-v33-${{ github.run_id }}-retry
          path: |
            _package/SMN-Setup-Windows-x64-v33-*.zip
            _package/SMN-Setup-Windows-x64-v33-*.zip.sha256
            _package/SMN-Setup-Windows-x64-v33-*.zip.evidence.json
            _package/smn-distribution-inventory.json
            _package/smn-antivirus-report.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Exiger une archive réellement publiée
        if: always()
        shell: pwsh
        env:
          PRIMARY: ${{ steps.artifact_primary.outcome }}
          RETRY: ${{ steps.artifact_retry.outcome }}
        run: |
          if ($env:PRIMARY -ne 'success' -and $env:RETRY -ne 'success') {
            throw 'Aucun ZIP Windows n a ete publie et confirme par GitHub Actions'
          }
