name: SMN-435-439 — Configurateur de tags Office
on:
  push:
    branches: [main]
    paths:
      - "src/app/app/reports/office-tag-configurator.tsx"
      - "src/app/app/reports/office-tags.tsx"
      - "src/app/app/reports/page.tsx"
      - "src/lib/office-tag-builder.ts"
      - "src/i18n/fr.json"
      - "src/i18n/en.json"
      - "tests/smn-435-439-office-tag-configurator.test.ts"
      - "tests/smn-office-row-sort.test.mjs"
      - ".github/workflows/smn-435-439-office-tag-configurator.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configurateur-tags:
    name: Validation du configurateur
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.10.0"
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Contrats des tags et tri
        run: pnpm exec tsx --test tests/smn-435-439-office-tag-configurator.test.ts tests/smn-office-row-sort.test.mjs
      - name: Non-régression des tableaux DOCX/PPTX
        run: pnpm exec tsx --test tests/smn-400-word-tables.test.mjs tests/smn-401-powerpoint-tables.test.mjs
      - name: Parité des traductions
        run: pnpm i18n:check
      - name: TypeScript
        run: pnpm typecheck
      - name: ESLint
        run: pnpm exec eslint src/app/app/reports/office-tag-configurator.tsx src/lib/office-tag-builder.ts tests/smn-435-439-office-tag-configurator.test.ts
