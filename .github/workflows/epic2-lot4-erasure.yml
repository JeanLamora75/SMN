name: Epic 2 Lot 4 — Erasure evidence and restoration privacy
on:
  push:
    branches: [main]
    paths:
      - "src/server/backup/erasure-ledger.ts"
      - "src/server/backup/erasure-intent.ts"
      - "src/server/backup/erasure-transaction.ts"
      - "src/app/api/admin/backups/restore/preflight/route.ts"
      - "src/server/members/lifecycle.ts"
      - "tests/smn-36-lifecycle-safety.test.ts"
      - "prisma/migrations/20261109_smn40_member_delete_guard/migration.sql"
      - "src/server/backup/erasure-restricted-member.ts"
      - "src/server/backup/erasure-dependent-member.ts"
      - "src/server/backup/erasure-archive-review.ts"
      - "src/app/api/admin/erasure/archive-review/route.ts"
      - "src/server/backup/erasure-completeness.ts"
      - "tests/epic2-lot4-archive-review.test.ts"
      - "src/server/reports/pdf-archive-store.ts"
      - "prisma/migrations/20261109_smn39_archive_restriction/migration.sql"
      - "tests/epic2-lot4-pdf-restriction.test.ts"
      - "src/app/api/admin/erasure/execute/route.ts"
      - "src/app/api/admin/erasure/preview/route.ts"
      - "src/app/app/admin/backups/erasure-impact-admin.tsx"
      - "src/i18n/fr.json"
      - "src/i18n/en.json"
      - "src/server/installation/install.ts"
      - "src/server/installation/contract.ts"
      - "prisma/migrations/20261109_smn39_privacy_receipt/migration.sql"
      - "src/server/backup/erasure-evidence-format.ts"
      - "src/server/backup/erasure-fk-discovery.ts"
      - "src/server/backup/erasure-office-fingerprint.ts"
      - "src/server/backup/erasure-plan-revision.ts"
      - "src/server/backup/historical-privacy-qualification.ts"
      - "tests/epic2-step2-*.test.ts"
      - "src/server/backup/erasure-report-binaries.ts"
      - "src/server/backup/erasure-protection.ts"
      - "src/app/api/admin/backups/restore/preflight/route.ts"
      - "src/server/backup/exceptional-erasure-policy.ts"
      - "tests/epic2-lot4-erasure-ledger.test.ts"
      - "tests/epic2-lot4-erasure-intent.test.ts"
      - "tests/epic2-lot4-fk-coverage.test.ts"
      - "tests/epic2-lot4-postgres.test.ts"
      - "tests/epic2-lot4-privacy-restore-pg.test.ts"
      - "tests/backup-erasure-protection.test.ts"
      - ".github/workflows/epic2-lot4-erasure.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  privacy-contracts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.10.0"
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Privacy and erasure ledger contracts
        run: pnpm exec tsx --test tests/epic2-lot4-erasure-ledger.test.ts tests/epic2-lot4-erasure-intent.test.ts tests/epic2-lot4-fk-coverage.test.ts tests/backup-erasure-protection.test.ts tests/exceptional-erasure-policy.test.ts tests/erasure-impact-preview.test.ts tests/erasure-impact-receipt.test.ts tests/erasure-indirect-archives.test.ts tests/erasure-ooxml-content.test.ts tests/epic2-lot4-pdf-restriction.test.ts tests/epic2-lot4-archive-review.test.ts tests/smn-36-lifecycle-safety.test.ts tests/epic2-step2-deletion-coverage.test.ts tests/epic2-step2-office-fingerprint.test.ts tests/epic2-step2-archive-db-integrity.test.ts tests/epic2-step2-historical-qualification.test.ts
      - name: TypeScript
        run: pnpm typecheck
      - name: Internationalization
        run: pnpm i18n:check

  postgres-18-impact:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: smn_ci
          POSTGRES_PASSWORD: smn_ci_ephemeral_test
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smn_ci -d postgres"
          --health-interval 10s --health-timeout 5s --health-retries 8
    env:
      SMN_TEST_DATABASE_URL: postgresql://smn_ci:smn_ci_ephemeral_test@127.0.0.1:5432/postgres
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.10.0"
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Verify real native v33 read-only impact on PostgreSQL 18
        run: pnpm exec tsx --test tests/epic2-lot4-postgres.test.ts tests/epic2-lot4-privacy-restore-pg.test.ts
