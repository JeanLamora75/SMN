name: Epic 2 Lot 4 — Erasure evidence and restoration privacy
on:
  push:
    branches: [main]
    paths:
      - "src/server/backup/erasure-ledger.ts"
      - "src/server/backup/erasure-intent.ts"
      - "src/server/backup/erasure-evidence-format.ts"
      - "src/server/backup/erasure-fk-discovery.ts"
      - "src/server/backup/erasure-protection.ts"
      - "src/app/api/admin/backups/restore/preflight/route.ts"
      - "src/server/backup/exceptional-erasure-policy.ts"
      - "tests/epic2-lot4-erasure-ledger.test.ts"
      - "tests/epic2-lot4-erasure-intent.test.ts"
      - "tests/epic2-lot4-fk-coverage.test.ts"
      - "tests/epic2-lot4-postgres.test.ts"
      - "tests/backup-erasure-protection.test.ts"
      - ".github/workflows/epic2-lot4-erasure.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  privacy-contracts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.10.0"
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Privacy and erasure ledger contracts
        run: pnpm exec tsx --test tests/epic2-lot4-erasure-ledger.test.ts tests/epic2-lot4-erasure-intent.test.ts tests/epic2-lot4-fk-coverage.test.ts tests/backup-erasure-protection.test.ts tests/exceptional-erasure-policy.test.ts tests/erasure-impact-preview.test.ts tests/erasure-impact-receipt.test.ts tests/erasure-indirect-archives.test.ts tests/erasure-ooxml-content.test.ts
      - name: TypeScript
        run: pnpm typecheck
      - name: Internationalization
        run: pnpm i18n:check

  postgres-18-impact:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: smn_ci
          POSTGRES_PASSWORD: smn_ci_ephemeral_test
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smn_ci -d postgres"
          --health-interval 10s --health-timeout 5s --health-retries 8
    env:
      SMN_TEST_DATABASE_URL: postgresql://smn_ci:smn_ci_ephemeral_test@127.0.0.1:5432/postgres
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.10.0"
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Verify real native v33 read-only impact on PostgreSQL 18
        run: pnpm exec tsx --test tests/epic2-lot4-postgres.test.ts
