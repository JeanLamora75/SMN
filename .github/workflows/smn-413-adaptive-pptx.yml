name: SMN-413 — Insertion PowerPoint adaptative
on:
  push:
    branches: [main]
    paths:
      - "scripts/smn-413-adaptive-pptx.mjs"
      - "tests/smn-413-adaptive-pptx.test.mjs"
      - "tests/smn-413-office-route.test.mjs"
      - "src/server/reports/office-indicator-charts.ts"
      - "src/app/api/admin/reports/office-templates/generate/route.ts"
      - "scripts/smn-412-adaptive-chart.mjs"
      - "tests/smn-412-adaptive-chart.test.mjs"
      - "src/app/app/reports/office-template-catalog.tsx"
      - "src/i18n/fr.json"
      - "src/i18n/en.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "next.config.ts"
      - ".github/workflows/smn-413-adaptive-pptx.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pptx:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.10.0"
          run_install: false
      - name: Dépendances natives de production, verrouillées
        run: pnpm install --frozen-lockfile
      - name: Tests géométrie, rendu, insertion et intégrité du PPTX
        run: node --test tests/smn-411-chart-targets.test.mjs tests/smn-412-adaptive-chart.test.mjs tests/smn-413-adaptive-pptx.test.mjs tests/smn-413-office-route.test.mjs
      - name: Non-régression des graphiques Word/PowerPoint précédents
        run: pnpm exec tsx --test tests/smn-402-office-trends.test.ts
      - name: TypeScript
        run: pnpm typecheck
      - name: Build Next.js standalone (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: SMN_BUILD_STANDALONE=1 pnpm build
      - name: Charger Resvg depuis une copie isolée du standalone
        if: matrix.os == 'ubuntu-latest'
        run: |
          test -f .next/standalone/server.js
          find .next/standalone -iname '*resvg*' -print | head -40
          isolated=$(mktemp -d)
          cp -a .next/standalone/. "$isolated/"
          cd "$isolated"
          node <<'NODE'
          const {Resvg}=require("@resvg/resvg-js");
          const png=new Resvg('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240"><rect width="400" height="240" fill="blue"/></svg>').render().asPng();
          if(png.readUInt32BE(16)!==400||png.readUInt32BE(20)!==240)process.exit(2);
          console.log("resvg-standalone-smoke-ok");
          NODE
      - name: Build Next.js standalone (Windows)
        if: matrix.os == 'windows-latest'
        env:
          SMN_BUILD_STANDALONE: "1"
        run: pnpm build
      - name: Exécuter Resvg hors du projet (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          if (-not (Test-Path ".next/standalone/server.js")) { throw "Serveur standalone introuvable" }
          $isolated = Join-Path $env:RUNNER_TEMP "smn413-standalone"
          New-Item -ItemType Directory -Path $isolated -Force | Out-Null
          node -e 'const fs=require("node:fs"),path=require("node:path"); for(const name of ["resvg-js","resvg-js-win32-x64-msvc"]){const src=path.join(".next","standalone","node_modules","@resvg",name);if(!fs.existsSync(src))throw Error("Module Resvg absent du standalone: "+name);const dst=path.join(process.env.RUNNER_TEMP,"smn413-standalone","node_modules","@resvg",name);fs.mkdirSync(path.dirname(dst),{recursive:true});fs.cpSync(fs.realpathSync(src),dst,{recursive:true,force:true,dereference:true});console.log("copied-resvg-module",name);}'
          if ($LASTEXITCODE -ne 0) { throw "Module Resvg introuvable dans le standalone" }
          Push-Location $isolated
          try {
            node -e 'const {Resvg}=require("@resvg/resvg-js"); const image=new Resvg("<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"400\" height=\"240\"></svg>").render().asPng(); if(image.readUInt32BE(16)!==400||image.readUInt32BE(20)!==240)process.exit(2); console.log("resvg-windows-standalone-smoke-ok");'
            if ($LASTEXITCODE -ne 0) { throw "Resvg introuvable dans le runtime autonome Windows" }
          } finally { Pop-Location }
      - name: ESLint
        run: pnpm exec eslint scripts/smn-413-adaptive-pptx.mjs tests/smn-413-adaptive-pptx.test.mjs scripts/smn-412-adaptive-chart.mjs src/server/reports/office-indicator-charts.ts src/app/api/admin/reports/office-templates/generate/route.ts
