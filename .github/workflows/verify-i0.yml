name: Vérification I0

on:
  push:
    branches: ["dev/bmad-i0-20261020", "dev/bmad-i0-smn12-20261020", "feat/smn-20-after-i18n", "main"]
  pull_request:
    branches: ["main", "dev/smn-27-i18n-json-20261020", "docs/bmad-sprint-readiness-20261019"]

permissions:
  contents: read

jobs:
  linux-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: smn_ci
          POSTGRES_PASSWORD: smn_ci_ephemeral_test
          POSTGRES_DB: smn
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smn_ci -d smn"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SMN_TEST_DATABASE_URL: postgresql://smn_ci:smn_ci_ephemeral_test@127.0.0.1:5432/smn_ci
      SMN_DATABASE_URL: postgresql://smn_ci:smn_ci_ephemeral_test@127.0.0.1:5432/smn
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.10.0"
          run_install: false
      - name: Installer exclusivement les versions verrouillées
        run: pnpm install --frozen-lockfile
      - name: Préparer la base éphémère dédiée aux contrats v31/v32
        run: |
          PGPASSWORD=smn_ci_ephemeral_test psql -h 127.0.0.1 -U smn_ci -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE smn_ci"
      - name: Contrat de validation v33
        run: pnpm test:validate-version
      - name: Qualité commune v33
        run: node scripts/validate-version.mjs --profile quality
      - name: Recette PostgreSQL isolée SMN-343
        run: pnpm db:test:smn-343
      - name: Recette PostgreSQL isolée SMN-344
        run: pnpm db:test:smn-344
      - name: Recette PostgreSQL isolée SMN-345
        run: pnpm db:test:smn-345
      - name: Recette PostgreSQL isolée SMN-346
        run: pnpm db:test:smn-346
      - name: Recette PostgreSQL isolée SMN-347
        run: pnpm db:test:smn-347
      - name: Contrats Cockpit Agile SMN-347
        run: pnpm test:smn-347
      - name: Intégration PostgreSQL saisie universelle SMN-348
        run: pnpm db:test:smn-348
      - name: Contrats de saisie universelle SMN-348
        run: pnpm test:smn-348
      - name: Contrats de retry SMN-346
        run: pnpm test:smn-346
      - name: Tests unitaires et intégration PG réelle
        run: pnpm test
      - name: Valider le schéma Prisma
        run: pnpm exec prisma validate
      - name: Diagnostic de port et de prérequis
        run: |
          pnpm run doctor
          SMN_PORT=3010 pnpm run doctor
          if SMN_PORT=3000 pnpm run doctor; then
            echo "SMN a accepté un port réservé."
            exit 1
          fi
      - name: Build de production
        run: pnpm build
      - name: HTTP production et diagnostics PostgreSQL
        run: node scripts/verify-http-ci.mjs

  windows-smoke:
    runs-on: windows-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.10.0"
          run_install: false
      - name: Installer les dépendances (Windows sans élévation)
        run: pnpm install --frozen-lockfile
      - name: Contrat de validation v33 sur Windows
        run: pnpm test:validate-version
      - name: Tests unitaires Windows sans base PostgreSQL (intégrations PG couvertes par linux-postgres)
        shell: pwsh
        run: |
          $pgPattern = "(?i)(postgres|(?:^|-)pg\.test|smn-338-(native|real|v33-upgrade)|smn-dashboard-bmad-pg|smn-333-v31-v32|smn-355-dashboard-layout)"
          $files = @(Get-ChildItem -Path tests -File | Where-Object { $_.Name -match "\.test\.(ts|mjs)$" -and $_.Name -notmatch $pgPattern } | ForEach-Object { "tests/$($_.Name)" })
          if ($files.Count -eq 0) { throw "Aucun test Windows sélectionné" }
          Write-Host "Tests Windows sans PG: $($files.Count) fichiers"
          # Windows imposes a short command-line limit; execute every selected test in bounded batches.
          $failedBatches = @()
          for ($offset = 0; $offset -lt $files.Count; $offset += 40) {
            $batch = @($files | Select-Object -Skip $offset -First 40)
            Write-Host "Exécution Windows: fichiers $($offset + 1) à $($offset + $batch.Count) / $($files.Count)"
            pnpm exec tsx --test @batch
            if ($LASTEXITCODE -ne 0) { $failedBatches += "$($offset + 1)-$($offset + $batch.Count)" }
          }
          if ($failedBatches.Count -gt 0) {
            Write-Error ("Lots Windows en échec : " + ($failedBatches -join ', '))
            exit 1
          }
        env:
          CI: "false"
      - name: Typecheck et build Windows
        run: |
          pnpm typecheck
          pnpm build
      - name: Diagnostiquer les prérequis
        run: pnpm run doctor
      - name: Démarrer Next en mode dev sous Windows
        run: node scripts/verify-windows-smoke.mjs

  independent-typecheck:
    name: TypeScript indépendant des tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.10.0"
          run_install: false
      - name: Installer les dépendances verrouillées
        run: pnpm install --frozen-lockfile
      - name: Vérifier les types, même si les tests métier échouent
        run: pnpm typecheck
      - name: Recette moteur et graphe indicateurs
        run: pnpm test:smn-341-342
      - name: Contrats SMN 343
        run: pnpm test:smn-343
      - name: Audit indépendant préconditions migration v32 vers v33
        run: pnpm exec tsx --test tests/smn-v33-migration-preflight-audit.test.ts tests/db-upgrade-v32-compatibility.test.ts tests/schema-compatibility.test.ts tests/auth-schema-v27.test.ts tests/auth-schema-v30.test.ts

  company-v31-contracts:
    name: Contrats entreprise v31 indépendants
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: smn_ci
          POSTGRES_PASSWORD: smn_ci_ephemeral_test
          POSTGRES_DB: smn_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smn_ci -d smn_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SMN_TEST_DATABASE_URL: postgresql://smn_ci:smn_ci_ephemeral_test@127.0.0.1:5432/smn_ci_ci
      SMN_DATABASE_URL: postgresql://smn_ci:smn_ci_ephemeral_test@127.0.0.1:5432/smn_ci_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.10.0"
          run_install: false
      - name: Installer les dépendances verrouillées
        run: pnpm install --frozen-lockfile
      - name: Exécuter les contrats v31 sans être bloqué par les tests historiques
        run: >-
          pnpm exec tsx --test
          tests/company-schema-migration.test.ts
          tests/company-catalog.test.ts
          tests/member-company.test.ts
          tests/company-closures-v31.test.ts
          tests/company-capacity.test.ts
          tests/company-capacity-outbox.test.ts
          tests/calendar-company-closures.test.ts
          tests/smn-315-v31-ci-gates.test.ts
          tests/smn-315-v31-readiness.test.ts

  schema-guard-regression:
    name: SMN-332 — Nouveaux gardes de schéma
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Valider les règles du détecteur
        run: node --test tests/smn-332-new-schema-guards.test.mjs
      - name: Refuser les gardes locaux introduits dans les API
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "Base Git absente : contrôle bloqué (fail closed)."
            exit 1
          fi
          node scripts/check-new-schema-guards.mjs --base="$BASE_SHA" --head="$HEAD_SHA"
