name: SMN-348 — Saisie universelle

on:
  push:
    branches: ["feature/smn-348-universal-input", "main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  scoped-input:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: smn_ci
          POSTGRES_PASSWORD: smn_ci_ephemeral_test
          POSTGRES_DB: smn_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smn_ci -d smn_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SMN_TEST_DATABASE_URL: postgresql://smn_ci:smn_ci_ephemeral_test@127.0.0.1:5432/smn_ci
      SMN_DATABASE_URL: postgresql://smn_ci:smn_ci_ephemeral_test@127.0.0.1:5432/smn_ci
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.10.0"
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:smn-348
      - run: pnpm db:test:smn-348
      - run: pnpm i18n:check
      - run: pnpm typecheck
      - run: pnpm lint
